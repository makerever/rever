name: Sync Repo

on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: 'Source branch to sync from'
        required: false
        default: ''
      target_repo:
        description: 'Target repository (owner/repo-name)'
        required: false
        default: ''
      target_branch:
        description: 'Target branch name'
        required: false
        default: ''
  push:
    branches:
      - preview

env:
  SOURCE_BRANCH_NAME: ${{ github.ref_name }}

jobs:
  sync_changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Push Changes to Target Repo
        env:
          GH_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        run: |
          TARGET_REPO="${{ vars.SYNC_TARGET_REPO }}"
          TARGET_BRANCH="${{ vars.SYNC_TARGET_BRANCH_NAME }}"
          SOURCE_BRANCH="${{ env.SOURCE_BRANCH_NAME }}"

          git checkout $SOURCE_BRANCH
          git remote add target-origin-a "https://$GH_TOKEN@github.com/$TARGET_REPO.git"
          git push target-origin-a $SOURCE_BRANCH:$TARGET_BRANCH
