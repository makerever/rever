name: Lint and Type Check

on:
  push:
  pull_request:

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '24'
        check-latest: true
        
    - name: Enable Corepack and pnpm
      run: |
        corepack enable
        corepack prepare pnpm@latest --activate
        pnpm -v
        
    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Run lint
      run: pnpm lint
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
        
    - name: Install uv
      run: pip install uv
      
    - name: Install dependencies
      run: |
        cd api
        uv venv
        source .venv/bin/activate
        uv sync --dev
        
    - name: Run Ruff
      run: |
        cd api
        source .venv/bin/activate
        ruff check .
          
    