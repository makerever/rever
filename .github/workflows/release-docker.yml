name: Build and Push Docker Images

# This workflow builds and pushes Docker images in parallel for improved performance.
# It can be triggered either automatically when a new GitHub release is created,
# or manually via the GitHub Actions UI.
# 
# Required GitHub secrets:
# - DOCKERHUB_USERNAME: Your Docker Hub username
# - DOCKERHUB_TOKEN: A Docker Hub access token with push permissions
#
# The workflow will tag images with both 'latest' and the specific version.

on:
  # release:
    # types: [created]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag for the Docker images (e.g., v1.0.0)'
        required: true
        default: 'latest'

jobs:
  # Build web image in parallel
  build-web:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.docker_build_web.outputs.digest }}
      version: ${{ steps.set_version.outputs.VERSION }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set version
      id: set_version
      run: |
        if [ "${{ github.event_name }}" = "release" ]; then
          echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
        else
          echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
        fi

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3
      with:
        platforms: linux/arm64,linux/amd64

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push web image
      uses: docker/build-push-action@v5
      id: docker_build_web
      with:
        context: .
        file: ./web/Dockerfile.web
        platforms: linux/amd64,linux/arm64
        push: true
        tags: |
          reverfin/rever-frontend:latest
          reverfin/rever-frontend:${{ steps.set_version.outputs.VERSION }}
        build-args: |
          NEXT_PUBLIC_API_BASE_URL=/api
        cache-from: type=registry,ref=reverfin/rever-frontend:buildcache
        cache-to: type=registry,ref=reverfin/rever-frontend:buildcache,mode=max

  # Build API image in parallel
  build-api:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.docker_build_api.outputs.digest }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set version
      id: set_version
      run: |
        if [ "${{ github.event_name }}" = "release" ]; then
          echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
        else
          echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
        fi

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3
      with:
        platforms: linux/arm64,linux/amd64

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push API image
      uses: docker/build-push-action@v5
      id: docker_build_api
      with:
        context: ./api
        file: ./api/Dockerfile.api
        platforms: linux/amd64,linux/arm64
        push: true
        tags: |
          reverfin/rever-api:latest
          reverfin/rever-api:${{ steps.set_version.outputs.VERSION }}
        cache-from: type=registry,ref=reverfin/rever-api:buildcache
        cache-to: type=registry,ref=reverfin/rever-api:buildcache,mode=max

  # Build proxy image in parallel
  build-proxy:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.docker_build_proxy.outputs.digest }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set version
      id: set_version
      run: |
        if [ "${{ github.event_name }}" = "release" ]; then
          echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
        else
          echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
        fi

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3
      with:
        platforms: linux/arm64,linux/amd64

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push proxy image
      uses: docker/build-push-action@v5
      id: docker_build_proxy
      with:
        context: ./nginx
        file: ./nginx/Dockerfile
        platforms: linux/amd64,linux/arm64
        push: true
        tags: |
          reverfin/rever-proxy:latest
          reverfin/rever-proxy:${{ steps.set_version.outputs.VERSION }}
        cache-from: type=registry,ref=reverfin/rever-proxy:buildcache
        cache-to: type=registry,ref=reverfin/rever-proxy:buildcache,mode=max

  # Summary job that runs after all builds complete
  build-summary:
    runs-on: ubuntu-latest
    needs: [build-web, build-api, build-proxy]
    if: always()
    steps:
    - name: Build Summary
      run: |
        echo "🚀 Docker image build process completed!"
        echo ""
        echo "📦 Image Digests:"
        echo "Web image digest: ${{ needs.build-web.outputs.digest }}"
        echo "API image digest: ${{ needs.build-api.outputs.digest }}"
        echo "Proxy image digest: ${{ needs.build-proxy.outputs.digest }}"
        echo ""
        echo "🏷️ Version: ${{ needs.build-web.outputs.version }}"
        echo ""
        echo "📊 Job Status:"
        echo "Web build: ${{ needs.build-web.result }}"
        echo "API build: ${{ needs.build-api.result }}"
        echo "Proxy build: ${{ needs.build-proxy.result }}"
